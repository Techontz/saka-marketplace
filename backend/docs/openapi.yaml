openapi: 3.1.0
info:
  title: 'SAKA Marketplace API'
  version: 1.0.0
  description: |-
    Multi-vertical marketplace API for Tanzania.

    **Errors.** Every failure returns the same envelope:

        { "error": { "code": "...", "message": "...", "details": {...}, "request_id": "..." } }

    Clients should switch on `error.code`, never on `message`. Validation failures (422) additionally carry Laravel's `errors` map.

    **Correlation.** Every response carries `X-Request-Id`; an inbound value is honoured when it matches `^[A-Za-z0-9_-]{8,64}$`.

    **Authentication.** Bearer tokens issued by `/auth/login`. Tokens are unscoped; authorization is enforced by server-side policies.

    **Not found vs forbidden.** Resources the caller may not see return 404, never 403, so existence is not disclosed.
  contact:
    name: 'SAKA Engineering'
  license:
    name: Proprietary
servers:
  -
    url: 'https://api.saka.co.tz/api/v1'
    description: Production
  -
    url: 'http://localhost:8000/api/v1'
    description: Local
tags:
  -
    name: System
    description: 'Health probes and metrics'
  -
    name: Authentication
    description: 'Registration, sign-in, tokens, phone verification'
  -
    name: Account
    description: 'The signed-in user acting on themselves'
  -
    name: Listings
    description: 'Public browse, search and detail'
  -
    name: Businesses
    description: 'Public business pages: profile, listings, reviews and nearby'
  -
    name: Search
    description: 'Type-ahead suggestions and popular searches'
  -
    name: Catalog
    description: 'Categories, attributes, locations and taxonomies'
  -
    name: Favorites
    description: 'Saved listings'
  -
    name: Reviews
    description: 'Seller and listing reviews'
  -
    name: Inquiries
    description: 'Contact seller and general contact'
  -
    name: 'Public places'
    description: 'Directory of hospitals, banks, schools and more'
  -
    name: Content
    description: 'FAQs, CMS pages and public settings'
  -
    name: Seller
    description: 'Managing your own listings and profile'
  -
    name: Media
    description: 'Listing images'
  -
    name: Administration
    description: 'Users, roles, verification, taxonomy, CMS and settings'
  -
    name: Moderation
    description: 'Administrative review queues'
paths:
  /account:
    delete:
      operationId: api_v1_account_destroy
      summary: 'Close your account'
      tags:
        - Account
      responses:
        200:
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        A SOFT delete. Hard-deleting would cascade through listings, reviews and inquiries — taking with it reviews other people rely on and inquiries a business still has open. Instead this releases the email and phone so the person can register again, revokes every token, and archives live listings so nothing stays on sale with no one behind it.

        The password is re-checked even though the caller is authenticated: a stolen session must not be enough to destroy an account.

        Rate limit: `api-authenticated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: 'Required unless the account has no password (OAuth-only).'
      security:
        -
          bearerAuth: []
  /account/avatar:
    post:
      operationId: api_v1_account_avatar_store
      summary: 'Upload or replace your avatar'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Multipart, and separate from the profile PATCH because it goes through the media pipeline — validation, EXIF stripping, variant generation. The previous avatar is deleted so iterating on a photo does not accumulate dead files.

        Rate limit: `api-authenticated`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      security:
        -
          bearerAuth: []
    delete:
      operationId: api_v1_account_avatar_destroy
      summary: 'Remove your avatar'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      security:
        -
          bearerAuth: []
  /account/favorites:
    get:
      operationId: api_v1_account_favorites_index
      summary: 'List favorited listings'
      tags:
        - Favorites
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ListingSummary' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      security:
        -
          bearerAuth: []
  /account/favorites/businesses:
    get:
      operationId: api_v1_account_favorites_businesses
      summary: 'Saved businesses'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Business' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      parameters:
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security:
        -
          bearerAuth: []
  '/account/favorites/businesses/{slug}':
    post:
      operationId: api_v1_account_favorites_businesses_store
      summary: 'Save a business'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      favorited: { type: boolean }
                      created: { type: boolean }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Idempotent: `created` is false when it was already saved.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: slug
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
    delete:
      operationId: api_v1_account_favorites_businesses_destroy
      summary: 'Un-save a business'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      favorited: { type: boolean }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Keeps the row and stamps `removed_at`, so it stays in favourite history.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: slug
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
  /account/favorites/history:
    get:
      operationId: api_v1_account_favorites_history
      summary: 'Everything ever saved, including what was removed'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/FavoriteHistoryEntry' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Un-saving stamps `removed_at` rather than deleting the row, which is what makes "I saved a flat last month and can't find it again" answerable. `target` is null when the listing or business has since been removed.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security:
        -
          bearerAuth: []
  /account/favorites/listings:
    get:
      operationId: api_v1_account_favorites_listings
      summary: 'Saved listings'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Listing' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      parameters:
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security:
        -
          bearerAuth: []
  '/account/favorites/{listing}':
    post:
      operationId: api_v1_account_favorites_store
      summary: 'Favorite a listing'
      tags:
        - Favorites
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FavoriteState'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Idempotent. Returns 404 for a listing the caller cannot see.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: listing
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
    delete:
      operationId: api_v1_account_favorites_destroy
      summary: 'Remove a favorite'
      tags:
        - Favorites
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FavoriteState'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      parameters:
        -
          name: listing
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
  /account/inquiries:
    get:
      operationId: api_v1_account_inquiries_index
      summary: 'Inquiries you have sent'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Inquiry' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Scoped by `sender_user_id`, so a message sent while signed out is not listed. Matching on email address instead would let anyone claim another person's history by registering their address.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: status
          in: query
          required: false
          schema:
            type: string
          description: 'new | read | replied | closed'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security:
        -
          bearerAuth: []
  '/account/inquiries/{inquiry}':
    get:
      operationId: api_v1_account_inquiries_show
      summary: 'One inquiry, with its timeline'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Inquiry'
                  meta:
                    type: object
                    properties:
                      timeline: { type: array, items: { type: object, properties: { event: { type: string }, label: { type: string }, at: { type: [string, 'null'], format: date-time } } } }
                      business: { type: [object, 'null'] }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        The timeline is DERIVED from the row's own timestamps rather than stored as events. An inquiry is one message and at most one reply, so a fabricated event log would imply a conversation that cannot happen: it reports only when it was sent, seen, answered and resolved.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: inquiry
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
  /account/notifications:
    get:
      operationId: api_v1_account_notifications_index
      summary: 'The notification centre'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        `meta.unread_count` rides on every page so the bell badge never needs a second request and can never disagree with the list beneath it.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: unread
          in: query
          required: false
          schema:
            type: boolean
        -
          name: type
          in: query
          required: false
          schema:
            type: string
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      security:
        -
          bearerAuth: []
  /account/notifications/preferences:
    get:
      operationId: api_v1_account_notifications_preferences
      summary: 'Notification preferences'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties: { key: { type: string }, enabled: { type: boolean }, default: { type: boolean } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Four coarse switches rather than one per notification type — a customer cannot meaningfully choose between "price dropped" and "back on sale". Moderation outcomes have no switch: being told your review was rejected is not marketing, and silencing it would make the removal look like content vanishing for no reason.

        Rate limit: `api-authenticated`.
      security:
        -
          bearerAuth: []
    patch:
      operationId: api_v1_account_notifications_preferences_update
      summary: 'Change notification preferences'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Merged, not replaced: sending one switch must not silently reset the others to their defaults.

        Rate limit: `api-authenticated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preferences
              properties:
                preferences:
                  type: object
                  properties:
                    favorite_alerts:
                      type: boolean
                    inquiry_replies:
                      type: boolean
                    review_replies:
                      type: boolean
                    listing_updates:
                      type: boolean
      security:
        -
          bearerAuth: []
  /account/notifications/read-all:
    post:
      operationId: api_v1_account_notifications_read_all
      summary: 'Mark every notification read'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      marked: { type: integer }
                      unread_count: { type: integer }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      security:
        -
          bearerAuth: []
  /account/notifications/unread-count:
    get:
      operationId: api_v1_account_notifications_unread
      summary: 'Unread notification count'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      security:
        -
          bearerAuth: []
  '/account/notifications/{id}':
    delete:
      operationId: api_v1_account_notifications_destroy
      summary: 'Dismiss a notification'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-


        Rate limit: `api-authenticated`.
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
  '/account/notifications/{id}/read':
    post:
      operationId: api_v1_account_notifications_read
      summary: 'Mark one notification read'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      read: { type: boolean }
                      unread_count: { type: integer }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Scoped to the caller — 404 for anyone else's notification, so a uuid cannot be marked read on someone's behalf.

        Rate limit: `api-authenticated`.
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      security:
        -
          bearerAuth: []
  /account/password:
    patch:
      operationId: api_v1_account_password_update
      summary: 'Change password'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires the current password. Revokes all other sessions.

        Rate limit: `api-authenticated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      security:
        -
          bearerAuth: []
  /account/profile:
    get:
      operationId: api_v1_account_profile_show
      summary: 'Read own profile'
      tags:
        - Account
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
