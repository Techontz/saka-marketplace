  schemas:
    Business:
      type: object
      description: 'A business as the public sees it. Registration number and TIN are absent by construction, not by a conditional.'
      properties:
        slug:
          type: string
        display_name:
          type: string
        business_type:
          type:
            - string
            - 'null'
        business_type_label:
          type:
            - string
            - 'null'
        logo_url:
          type:
            - string
            - 'null'
        location:
          type: object
        rating:
          type: object
          properties:
            average:
              type:
                - number
                - 'null'
            count:
              type: integer
        listing_count:
          type: integer
        is_verified:
          type: boolean
        distance_km:
          type:
            - number
            - 'null'
          description: 'Present only on a radius search.'
    BusinessDetail:
      type: object
      description: 'Business, plus everything a business PAGE needs: contact, hours, social links, verification and stats.'
      allOf:
        -
          $ref: '#/components/schemas/Business'
      properties:
        bio:
          type:
            - string
            - 'null'
        cover_url:
          type:
            - string
            - 'null'
        contact:
          type: object
        opening_hours:
          type:
            - object
            - 'null'
          description: 'Null means never configured; an empty day means closed that day.'
        social_links:
          type:
            - object
            - 'null'
        verification:
          type: object
        stats:
          type: object
        member_since:
          type:
            - string
            - 'null'
          format: date-time
    SearchSuggestion:
      type: object
      properties:
        type:
          type: string
          enum:
            - listing
            - business
            - category
            - place
        label:
          type: string
        slug:
          type: string
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: 'e.g. inquiry.replied, favorite.price_changed, listing.approved'
        data:
          type: object
          description: 'Rendered at write time: title, body, and whatever the client needs to link to the thing it is about.'
          additionalProperties: true
        read:
          type: boolean
        read_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    FavoriteHistoryEntry:
      type: object
      properties:
        type:
          type: string
          enum:
            - listing
            - business
        saved_at:
          type:
            - string
            - 'null'
          format: date-time
        removed_at:
          type:
            - string
            - 'null'
          format: date-time
        still_saved:
          type: boolean
        target:
          type:
            - object
            - 'null'
          description: 'Null when the listing or business has since been removed.'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
          required:
            - code
            - message
      required:
        - error
    ValidationError:
