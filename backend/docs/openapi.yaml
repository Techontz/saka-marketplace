          type: string
        title:
          type: string
        price:
          oneOf:
            -
              $ref: '#/components/schemas/Price'
            -
              type: 'null'
        purpose:
          type:
            - string
            - 'null'
        condition:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - draft
            - pending_review
            - published
            - rejected
            - paused
            - expired
            - sold
            - archived
        is_verified:
          type: boolean
        is_featured:
          type: boolean
        category:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            icon:
              type:
                - string
                - 'null'
            parent:
              type:
                - object
                - 'null'
              description: 'The vertical this listing belongs to ("Property"), as distinct from its leaf category ("Apartments"). Null when the listing is attached directly to a root category.'
              properties:
                slug:
                  type: string
                name:
                  type: string
                icon:
                  type:
                    - string
                    - 'null'
        location:
          type: object
          properties:
            region:
              type:
                - string
                - 'null'
            region_slug:
              type:
                - string
                - 'null'
            district:
              type:
                - string
                - 'null'
            district_slug:
              type:
                - string
                - 'null'
            ward:
              type:
                - string
                - 'null'
            ward_slug:
              type:
                - string
                - 'null'
            address_line:
              type:
                - string
                - 'null'
            latitude:
              type:
                - number
                - 'null'
            longitude:
              type:
                - number
                - 'null'
        distance_km:
          type:
            - number
            - 'null'
        primary_image:
          oneOf:
            -
              $ref: '#/components/schemas/Media'
            -
              type: 'null'
        stats:
          type: object
          properties:
            views:
              type: integer
            favorites:
              type: integer
            inquiries:
              type: integer
        published_at:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        attributes:
          type: object
          description: |-
            The listing's EAV values as a flat `code => value` map, e.g. `{"beds": 2, "sqft": 1259}`.

            Present on LIST responses as well as detail, so a results page can render bedrooms and area without fetching each listing individually. Read from the `search_document` projection on the row, so it costs no extra query.

            Note the shape difference: the DETAIL response returns `attributes` as an ARRAY of objects carrying name, unit and label as well as the value.
          additionalProperties: true
          examples:
            -
              beds: 2
              bathrooms: 2
              sqft: 1259
    Listing:
      allOf:
        -
          $ref: '#/components/schemas/ListingSummary'
        -
          type: object
          properties:
            description:
