                      data: { type: array, items: { $ref: '#/components/schemas/ListingSummary' } }
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Open to guests. Supports offset pagination (`page`) and cursor pagination (`cursor`).

        Rate limit: `api-public`.
      parameters:
        -
          name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: 'Full-text keyword search.'
        -
          name: category
          in: query
          schema:
            type: string
          description: 'Category slug; includes the whole subtree.'
        -
          name: subcategory
          in: query
          schema:
            type: string
        -
          name: region
          in: query
          schema:
            type: string
        -
          name: district
          in: query
          schema:
            type: string
        -
          name: ward
          in: query
          schema:
            type: string
        -
          name: place
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: 'Free-text place search, for a single "where?" input. Prefix-matches a ward, district or region name, and also the seller-typed address line — so "Masaki" (a ward), "Ilala" (a district) and "Posta" (neither, just an address) all work without the caller knowing which is which. Ignored when a more specific `ward`, `district` or `region` slug is supplied.'
        -
          name: min_price
          in: query
          schema:
            type: integer
            minimum: 0
          description: 'Minor units.'
        -
          name: max_price
          in: query
          schema:
            type: integer
            minimum: 0
        -
          name: purpose
          in: query
          schema:
            type: string
            enum:
              - rent
              - sale
              - lease
        -
          name: condition
          in: query
          schema:
            type: string
            enum:
              - new
              - used
              - refurbished
        -
          name: verified
          in: query
          schema:
            type: boolean
        -
          name: featured
          in: query
          schema:
            type: boolean
        -
          name: amenities
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: 'Amenity slugs, AND-combined.'
        -
          name: facilities
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        -
          name: attributes
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: true
          description: 'Category-specific EAV filters, e.g. attributes[beds][min]=2 or attributes[fuel_type]=diesel.'
        -
          name: lat
          in: query
          schema:
            type: number
          description: 'Required with radius.'
        -
          name: lng
          in: query
          schema:
            type: number
        -
          name: radius
          in: query
          schema:
            type: number
            minimum: 0.1
            maximum: 500
          description: 'Kilometres. Capped so the bounding-box prefilter stays effective.'
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - oldest
              - price_asc
              - price_desc
              - popularity
              - distance
              - relevance
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: cursor
          in: query
          schema:
            type: string
