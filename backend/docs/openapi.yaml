  /admin/listings:
    get:
      operationId: api_v1_admin_listings_index
      summary: 'Search every listing, any status'
      tags:
        - Administration
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ListingSummary' } }
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires `listing.moderate`. Unlike `GET /listings`, which is scoped to publicly-visible listings, this sees drafts, rejections and archives.

        Search is a plain infix LIKE rather than the public FULLTEXT index: moderators search a fragment of a title they were sent, and FULLTEXT cannot do infix matching. That is a table scan, accepted because this surface has a small concurrent audience.

        Rate limit: `admin`.
      parameters:
        -
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: 'Infix match on title, slug or uuid.'
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - pending_review
              - published
              - rejected
              - paused
              - expired
              - sold
              - archived
          description: 'Exact status.'
        -
          name: category
          in: query
          required: false
          schema:
            type: string
          description: 'Category slug.'
        -
          name: seller
          in: query
          required: false
          schema:
            type: string
          description: 'Seller uuid.'
        -
          name: featured
          in: query
          required: false
          schema:
            type: boolean
          description: 'Only featured, or only not.'
        -
          name: verified
          in: query
          required: false
          schema:
            type: boolean
          description: 'Only verified, or only not.'
        -
          name: trashed
          in: query
          required: false
          schema:
            type: boolean
          description: 'Return SOFT-DELETED listings instead of live ones.'
        -
          name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - oldest
              - updated
              - price_asc
              - price_desc
              - views
            default: updated
          description: Ordering.
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: 'Results per page.'
      security:
        -
          bearerAuth: []
  /admin/listings/bulk:
    post:
      operationId: api_v1_admin_listings_bulk
      summary: 'Apply one action to many listings'
      tags:
        - Administration
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BulkResult'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires `listing.moderate`, plus `listing.delete_any` for `delete` and `listing.feature` for feature/unfeature.

        PARTIAL SUCCESS BY DESIGN: each listing is processed independently and one that cannot make the transition is reported in `failed` rather than aborting the batch. A moderator clearing a queue of 50 wants the 49 that worked plus a list of what did not, not a rollback.

        `force_delete` is not an allowed action.

        Rate limit: `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - uuids
              properties:
                action:
                  type: string
                  enum:
                    - approve
                    - reject
                    - archive
                    - feature
                    - unfeature
                    - verify
                    - delete
                uuids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                reason:
                  type: string
                  maxLength: 1000
      security:
        -
          bearerAuth: []
