        -
          bearerAuth: []
  /admin/system/maintenance:
    post:
      operationId: api_v1_admin_system_maintenance
      summary: 'Toggle maintenance mode'
      tags:
        - Administration
      responses:
        200:
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires `settings.manage`. Refuses when `APP_MAINTENANCE_DRIVER=file` on a deployment flagged multi-node — the file driver only takes down the node that handled the request, leaving the platform half-up in a way that is very hard to diagnose.

        No bypass secret is generated: it would have to be returned in this response and would then live in browser history and every proxy log in between.

        Rate limit: `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                message:
                  type: string
                  maxLength: 255
                retry_after:
                  type: integer
                  minimum: 10
                  maximum: 86400
                  description: 'Retry-After header, in seconds.'
      security:
        -
          bearerAuth: []
