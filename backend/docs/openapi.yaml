        -
          bearerAuth: []
  '/admin/users/{user}/status':
    patch:
      operationId: api_v1_admin_users_status
      summary: 'Suspend, ban or restore a user'
      tags:
        - Administration
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires `user.suspend`; setting `banned` additionally requires `user.ban`.

        A status that cannot authenticate revokes every token immediately, so the session ends now rather than when the token happens to expire.

        Returns 403 when the target is yourself (an organisation must not be able to lock itself out) or a super administrator.

        Rate limit: `admin`.
      parameters:
        -
          name: user
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      security:
        -
          bearerAuth: []
