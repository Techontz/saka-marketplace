      operationId: api_v1_admin_users_roles
      summary: "Replace a user's roles"
      tags:
        - Administration
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AdminUser'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires `user.assign_role`. The set is REPLACED, not merged.

        `super_admin` is rejected at the validation layer and re-checked against `roles.is_assignable`, so it can never be granted through the API. Acting on yourself or on a super administrator returns 403.

