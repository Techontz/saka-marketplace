  /business-types:
    get:
      operationId: api_v1_business_types
      summary: 'Business types and the rules each implies'
      tags:
        - Catalog
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessType'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Public — the vendor registration screen needs this before an account exists.

        This is the axis the multi-vertical design turns on. Each entry says which catalogue verticals the business posts into, whether opening hours and a walk-in address are meaningful, and what that trade CALLS a listing (a hotel has rooms, a dealer has vehicles). Clients render their forms from this rather than carrying a second copy of the rules.
  /businesses:
    get:
      operationId: api_v1_businesses_index
      summary: 'Search, browse and find businesses near a point'
      tags:
        - Businesses
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedEnvelope'
                  -
                    type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Business' } }
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Keyword search, trade filter and radius search in one endpoint, because a map needs all three from a single call — panning is a radius search, typing is a keyword search, and the two combine.

        Only businesses that have COMPLETED onboarding, or have at least one publicly visible listing, appear here. A profile row is created the moment a vendor opens the portal, so "has a profile" is not the same as "is a business".

        When `lat`/`lng`/`radius` are given, each result carries `distance_km` and the default sort is nearest-first.

        Rate limit: `api-public`.
      parameters:
        -
          name: q
          in: query
          required: false
          schema:
            type: string
          description: 'Matches display name, business name and bio.'
        -
          name: business_type
          in: query
          required: false
          schema:
            type: string
          description: 'One of the values from /business-types.'
        -
          name: region
          in: query
          required: false
          schema:
            type: string
        -
          name: district
          in: query
          required: false
          schema:
            type: string
        -
          name: verified
          in: query
          required: false
          schema:
            type: boolean
        -
          name: featured
          in: query
          required: false
          schema:
            type: boolean
          description: 'Verified businesses that currently have live listings.'
        -
          name: lat
          in: query
          required: false
          schema:
            type: number
          description: 'Centre latitude. Required with radius.'
        -
          name: lng
          in: query
          required: false
          schema:
            type: number
          description: 'Centre longitude. Required with radius.'
        -
          name: radius
          in: query
          required: false
          schema:
            type: number
            minimum: 0.1
            maximum: 500
          description: 'Kilometres, 0.1–500. Capped so a geo search cannot become a full scan.'
        -
          name: sort
          in: query
          required: false
          schema:
            type: string
          description: 'relevance | rating | listings | newest | distance'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
