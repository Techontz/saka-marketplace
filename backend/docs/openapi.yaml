  /admin/system/cache:
    post:
      operationId: api_v1_admin_system_cache
      summary: 'Clear a cache group'
      tags:
        - Administration
      responses:
        200:
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/RateLimited'
        500:
          $ref: '#/components/responses/ServerError'
      description: |-
        Requires `settings.manage`. Targeted rather than global: discarding the whole cache on a warm instance sends every subsequent request to the database at once.

        There is no `flush` target. Cache and queue can share a Redis instance, so a FLUSHDB from a settings screen would discard queued jobs.

