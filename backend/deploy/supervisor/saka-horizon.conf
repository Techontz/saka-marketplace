;==============================================================================
; SAKA — Horizon process supervision
;
; Install:  sudo cp deploy/supervisor/*.conf /etc/supervisor/conf.d/
;           sudo supervisorctl reread && sudo supervisorctl update
;
; ONE Horizon process per host. Horizon is itself a supervisor: it forks and
; scales the per-queue workers described in config/horizon.php. Running
; numprocs>1 here would start two competing masters that each try to scale to
; their configured maximum, so the box ends up with double the workers it was
; sized for.
;
; Do NOT also run `queue:work` alongside this. Horizon owns the queues; a
; stray worker consumes jobs Horizon cannot see, and its metrics silently
; under-report.
;==============================================================================

[program:saka-horizon]
process_name=%(program_name)s
command=php /var/www/saka/artisan horizon
directory=/var/www/saka

; Horizon traps SIGTERM and finishes the job in flight before exiting, so a
; deploy never kills a half-processed image resize.
stopsignal=SIGTERM

; Must exceed the longest job timeout in config/horizon.php (media: 180s) plus
; headroom, or supervisor SIGKILLs a worker mid-job and the job is retried
; from scratch.
stopwaitsecs=300

autostart=true
autorestart=true
startsecs=5
startretries=3
numprocs=1

user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/saka-horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
