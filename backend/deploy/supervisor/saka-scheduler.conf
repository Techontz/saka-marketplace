;==============================================================================
; SAKA — scheduler
;
; `schedule:work` is a long-running process that fires due tasks every minute.
; It is used here INSTEAD of a crontab entry so that the scheduler is supervised
; and restarted like everything else, and so a single deploy artefact describes
; the whole runtime.
;
; If you prefer cron, the equivalent single line is:
;
;   * * * * * cd /var/www/saka && php artisan schedule:run >> /dev/null 2>&1
;
; Use ONE of the two, never both — every scheduled task in routes/console.php
; is wrapped in withoutOverlapping() and onOneServer(), so a duplicate runner
; would not corrupt data, but it would double the lock churn and make the
; scheduler's own logs misleading.
;
; MULTI-HOST NOTE: onOneServer() requires a shared cache (Redis) and elects one
; host per task per minute. Running this on every app node is therefore safe and
; is what gives you failover — do not try to designate a single "cron box".
;==============================================================================

[program:saka-scheduler]
process_name=%(program_name)s
command=php /var/www/saka/artisan schedule:work
directory=/var/www/saka

autostart=true
autorestart=true
startsecs=5
startretries=3
numprocs=1

; Let a running task (the view rollup can take a while on a large table) finish.
stopsignal=SIGTERM
stopwaitsecs=120

user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/saka-scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
